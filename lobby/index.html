<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>game-hub 로비</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f2a; }
      #app { display: block; width: 100vw; height: 100vh; }

      /* 첫 화면 (src/room/entry-screen.ts) — 그림이 들어오기 전 임시 모양 */
      body { font-family: system-ui, sans-serif; color: #eceff4; }
      .hub-overlay {
        position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px;
        background: rgb(16 19 27 / 0.6);
      }
      .hub-card {
        display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%);
        padding: 24px; border-radius: 12px; background: #2e3440; box-shadow: 0 8px 32px rgb(0 0 0 / 0.4);
      }
      .hub-title { margin: 0 0 4px; font-size: 22px; text-align: center; }
      .hub-sub { margin: 0; text-align: center; color: #a3adc2; font-size: 14px; }
      .hub-input {
        min-width: 0; flex: 1; padding: 10px 12px; border: 1px solid #4c566a; border-radius: 8px;
        background: #3b4252; color: inherit; font: inherit;
      }
      .hub-input:focus { outline: 2px solid #88c0d0; outline-offset: 0; }
      .hub-row { display: flex; gap: 8px; }
      .hub-btn {
        padding: 10px 14px; border: 0; border-radius: 8px; background: #4c566a; color: inherit;
        font: inherit; cursor: pointer;
      }
      .hub-btn:hover { background: #5e6a82; }
      .hub-primary { background: #5e81ac; font-weight: 600; }
      .hub-primary:hover { background: #6d90bb; }
      .hub-or { text-align: center; color: #a3adc2; font-size: 13px; }
      /* 첫 화면 맵 고르기 (src/room/entry-screen.ts) — 꾸미기 창의 ◀ ▶ 줄과 같은 모양 */
      .hub-map-row { align-items: center; }
      .hub-map-name { flex: 1; text-align: center; font-size: 14px; }
      .hub-error { margin: 0; min-height: 1.2em; color: #e5a0a0; font-size: 13px; }
      /* 오른쪽 위 버튼 줄 (src/hud/hud-bar.ts) — 사람(인원·접속자 목록)·설정 */
      .hub-hud {
        position: fixed; top: 12px; right: 12px; z-index: 20; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
      }
      .hub-hud-bar { display: flex; gap: 6px; }
      .hub-icon-btn {
        display: flex; align-items: center; gap: 6px; height: 36px; min-width: 36px; padding: 0 8px; border: 0;
        border-radius: 10px; background: rgb(46 52 64 / 0.85); color: #d8dee9; font: inherit; font-size: 14px;
        cursor: pointer; justify-content: center;
      }
      .hub-icon-btn:hover, .hub-icon-btn.hub-on { background: #4c566a; color: #eceff4; }
      .hub-people-count { min-width: 1ch; font-weight: 600; }
      .hub-panel {
        display: flex; flex-direction: column; gap: 8px; width: min(260px, calc(100vw - 24px)); padding: 12px 14px;
        border-radius: 12px; background: rgb(46 52 64 / 0.95); box-shadow: 0 8px 24px rgb(0 0 0 / 0.35);
      }
      .hub-panel[hidden] { display: none; }
      .hub-panel-title { margin: 4px 0 0; color: #a3adc2; font-size: 12px; font-weight: 600; }
      .hub-panel-title:first-child { margin-top: 0; }
      .hub-panel .hub-input { padding: 6px 10px; }
      .hub-center { align-items: center; }
      .hub-code { flex: 1; font-size: 20px; font-weight: 700; letter-spacing: 0.12em; }
      .hub-hint { margin: 0; min-height: 1.2em; color: #a3be8c; font-size: 12px; }
      .hub-danger { margin-top: 4px; background: #8c4a52; }
      .hub-danger:hover { background: #a3545e; }
      .hub-people {
        display: flex; flex-direction: column; gap: 6px; max-height: 50vh; margin: 0; padding: 0; overflow-y: auto;
        list-style: none; font-size: 14px;
      }
      .hub-person { display: flex; align-items: center; gap: 8px; }
      .hub-person-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
      .hub-person-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hub-person-me { color: #a3adc2; font-size: 12px; }
      .hub-person-crown { display: flex; color: #ebcb8b; }
      .hub-person-crown svg { width: 14px; height: 14px; }
      /* 꾸미기 창 — 48×64 그림을 2배로, 픽셀 그대로 */
      .hub-look-preview {
        align-self: center; width: 96px; height: 128px; image-rendering: pixelated; border-radius: 8px;
        background: rgb(0 0 0 / 0.2);
      }
      .hub-look-row { align-items: center; }
      .hub-look-part { flex: none; width: 52px; color: #a3adc2; font-size: 12px; }
      .hub-look-value { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; }
      .hub-look-step { flex: none; padding: 4px 8px; }
      /* 위쪽 가운데 연결 알림 — 열려 있으면 숨김 */
      .hub-notice {
        position: fixed; top: 12px; left: 50%; z-index: 20; transform: translateX(-50%); padding: 6px 12px; border-radius: 10px;
        background: rgb(46 52 64 / 0.9); color: #ebcb8b; font-size: 13px;
      }
      .hub-notice[hidden] { display: none; }
      /* 편집 중 문을 누르면 그 옆에 뜨는 게임 목록 (src/edit/door-picker.ts) — 자리는 스크립트가 */
      .hub-door-picker { position: fixed; z-index: 20; width: 200px; }
      .hub-door-choices { display: flex; flex-direction: column; gap: 6px; }
      .hub-door-choices .hub-btn { text-align: left; }
      .hub-btn.hub-on { background: #5e81ac; font-weight: 600; }
      .hub-edit-btn[hidden] { display: none; }
      /* 편집 중 도구 줄(아래쪽 가운데 — 위쪽은 맵 윗줄의 문을 가린다)과 놓기 물체 목록(왼쪽 위) (src/edit/edit-tools.ts) — 채팅창(왼쪽 아래)을 가리지 않게 높이 제한 */
      .hub-edit-tools {
        position: fixed; bottom: 12px; left: 50%; z-index: 20; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px;
        border-radius: 10px; background: rgb(46 52 64 / 0.9);
      }
      .hub-edit-tools[hidden] { display: none; }
      .hub-object-panel { position: fixed; top: 12px; left: 12px; z-index: 20; max-height: 55vh; }
      .hub-object-groups { display: flex; flex-wrap: wrap; gap: 4px; }
      .hub-object-groups .hub-btn { padding: 4px 8px; font-size: 12px; }
      .hub-object-kinds { display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow-y: auto; }
      .hub-object-kinds .hub-btn { text-align: left; }
      /* 캐릭터 머리 위 — 말풍선(있을 때만) + 이름표. main.ts 가 매 프레임 자리를 옮긴다.
         z-index 층: 머리 위 10 < 버튼 줄·창·알림·채팅 20 < 첫 화면 30 — 사람이 들어올 때마다 body 끝에 붙어 창을 덮던 것 */
      .hub-head {
        position: fixed; left: 0; top: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 4px;
        transform: translate(-50%, -100%); pointer-events: none;
      }
      .hub-tag {
        padding: 1px 6px; border-radius: 6px; background: rgb(46 52 64 / 0.75); font-size: 12px; white-space: nowrap;
      }
      .hub-bubble {
        max-width: 220px; padding: 4px 8px; border-radius: 8px; background: #eceff4; color: #2e3440;
        font-size: 13px; overflow-wrap: anywhere;
      }
      .hub-bubble[hidden] { display: none; }
      /* 채팅창 (src/chat/chat-box.ts) */
      .hub-chat {
        position: fixed; left: 12px; bottom: 12px; z-index: 20; display: flex; flex-direction: column; gap: 6px;
        width: min(360px, calc(100vw - 24px));
      }
      /* 닫힌 창(기본): 새 줄만 잠깐, 배경 없이 글자 그림자로만 읽히게, 스크롤 없음 */
      .hub-chat-log {
        display: flex; flex-direction: column; gap: 2px; max-height: 160px; overflow: hidden; padding: 6px 10px;
        border-radius: 10px; font-size: 13px; text-shadow: 0 1px 2px rgb(0 0 0 / 0.9), 0 0 4px rgb(0 0 0 / 0.6);
      }
      .hub-chat-log:empty, .hub-chat-quiet { display: none; }
      .hub-chat-line { overflow-wrap: anywhere; transition: opacity 1s; } /* 1s = chat.ts LINE_FADE_MS */
      .hub-chat-fading { opacity: 0; }
      .hub-chat-old { display: none; }
      .hub-chat-name { margin-right: 6px; color: #88c0d0; font-weight: 600; }
      .hub-chat-mine .hub-chat-name { color: #a3be8c; }
      .hub-chat-input {
        flex: none; padding: 8px 10px; border-color: transparent; background: rgb(59 66 82 / 0.45); font-size: 14px;
      }
      .hub-chat-input::placeholder { color: rgb(236 239 244 / 0.75); }
      /* 열린 창(입력 중): 지난 줄까지 모두, 진한 배경, 스크롤 */
      .hub-chat-open .hub-chat-log {
        display: flex; overflow-y: auto; background: rgb(46 52 64 / 0.85); text-shadow: none;
        scrollbar-width: thin; scrollbar-color: rgb(136 192 208 / 0.5) transparent;
      }
      .hub-chat-open .hub-chat-log:empty { display: none; }
      .hub-chat-open .hub-chat-fading { opacity: 1; }
      .hub-chat-open .hub-chat-old { display: block; }
      .hub-chat-open .hub-chat-input { border-color: #4c566a; background: rgb(59 66 82 / 0.9); }
      /* 크롬·사파리 옛 버전용 — scrollbar-width 를 모르면 이 모양 */
      .hub-chat-log::-webkit-scrollbar { width: 6px; }
      .hub-chat-log::-webkit-scrollbar-track { background: transparent; }
      .hub-chat-log::-webkit-scrollbar-thumb { border-radius: 3px; background: rgb(136 192 208 / 0.5); }
      .hub-small { padding: 6px 10px; font-size: 13px; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
