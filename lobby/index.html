<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>game-hub 로비</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f2a; }
      #app { display: block; width: 100vw; height: 100vh; }

      /* 첫 화면·방 표시 (src/entry-screen.ts) — 그림이 들어오기 전 임시 모양 */
      body { font-family: system-ui, sans-serif; color: #eceff4; }
      .hub-overlay {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
        background: rgb(16 19 27 / 0.6);
      }
      .hub-card {
        display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%);
        padding: 24px; border-radius: 12px; background: #2e3440; box-shadow: 0 8px 32px rgb(0 0 0 / 0.4);
      }
      .hub-title { margin: 0 0 4px; font-size: 22px; text-align: center; }
      .hub-sub { margin: 0; text-align: center; color: #a3adc2; font-size: 14px; }
      .hub-input {
        min-width: 0; flex: 1; padding: 10px 12px; border: 1px solid #4c566a; border-radius: 8px;
        background: #3b4252; color: inherit; font: inherit;
      }
      .hub-input:focus { outline: 2px solid #88c0d0; outline-offset: 0; }
      .hub-row { display: flex; gap: 8px; }
      .hub-btn {
        padding: 10px 14px; border: 0; border-radius: 8px; background: #4c566a; color: inherit;
        font: inherit; cursor: pointer;
      }
      .hub-btn:hover { background: #5e6a82; }
      .hub-primary { background: #5e81ac; font-weight: 600; }
      .hub-primary:hover { background: #6d90bb; }
      .hub-or { text-align: center; color: #a3adc2; font-size: 13px; }
      .hub-error { margin: 0; min-height: 1.2em; color: #e5a0a0; font-size: 13px; }
      .hub-badge {
        position: fixed; top: 12px; left: 12px; display: flex; align-items: center; gap: 10px;
        padding: 6px 8px 6px 12px; border-radius: 10px; background: rgb(46 52 64 / 0.85); font-size: 14px;
      }
      .hub-badge-room { font-weight: 600; letter-spacing: 0.05em; }
      .hub-badge-name { color: #a3adc2; }
      .hub-badge-status { color: #a3be8c; font-size: 13px; }
      /* 캐릭터 머리 위 — 말풍선(있을 때만) + 이름표. main.ts 가 매 프레임 자리를 옮긴다 */
      .hub-head {
        position: fixed; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 4px;
        transform: translate(-50%, -100%); pointer-events: none;
      }
      .hub-tag {
        padding: 1px 6px; border-radius: 6px; background: rgb(46 52 64 / 0.75); font-size: 12px; white-space: nowrap;
      }
      .hub-bubble {
        max-width: 220px; padding: 4px 8px; border-radius: 8px; background: #eceff4; color: #2e3440;
        font-size: 13px; overflow-wrap: anywhere;
      }
      .hub-bubble[hidden] { display: none; }
      /* 채팅창 (src/chat-box.ts) */
      .hub-chat {
        position: fixed; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px;
        width: min(360px, calc(100vw - 24px));
      }
      /* 닫힌 창(기본): 새 줄만 잠깐, 배경 없이 글자 그림자로만 읽히게, 스크롤 없음 */
      .hub-chat-log {
        display: flex; flex-direction: column; gap: 2px; max-height: 160px; overflow: hidden; padding: 6px 10px;
        border-radius: 10px; font-size: 13px; text-shadow: 0 1px 2px rgb(0 0 0 / 0.9), 0 0 4px rgb(0 0 0 / 0.6);
      }
      .hub-chat-log:empty, .hub-chat-quiet { display: none; }
      .hub-chat-line { overflow-wrap: anywhere; transition: opacity 1s; } /* 1s = chat.ts LINE_FADE_MS */
      .hub-chat-fading { opacity: 0; }
      .hub-chat-old { display: none; }
      .hub-chat-name { margin-right: 6px; color: #88c0d0; font-weight: 600; }
      .hub-chat-mine .hub-chat-name { color: #a3be8c; }
      .hub-chat-input {
        flex: none; padding: 8px 10px; border-color: transparent; background: rgb(59 66 82 / 0.45); font-size: 14px;
      }
      .hub-chat-input::placeholder { color: rgb(236 239 244 / 0.75); }
      /* 열린 창(입력 중): 지난 줄까지 모두, 진한 배경, 스크롤 */
      .hub-chat-open .hub-chat-log {
        display: flex; overflow-y: auto; background: rgb(46 52 64 / 0.85); text-shadow: none;
        scrollbar-width: thin; scrollbar-color: rgb(136 192 208 / 0.5) transparent;
      }
      .hub-chat-open .hub-chat-log:empty { display: none; }
      .hub-chat-open .hub-chat-fading { opacity: 1; }
      .hub-chat-open .hub-chat-old { display: block; }
      .hub-chat-open .hub-chat-input { border-color: #4c566a; background: rgb(59 66 82 / 0.9); }
      /* 크롬·사파리 옛 버전용 — scrollbar-width 를 모르면 이 모양 */
      .hub-chat-log::-webkit-scrollbar { width: 6px; }
      .hub-chat-log::-webkit-scrollbar-track { background: transparent; }
      .hub-chat-log::-webkit-scrollbar-thumb { border-radius: 3px; background: rgb(136 192 208 / 0.5); }
      .hub-small { padding: 6px 10px; font-size: 13px; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
